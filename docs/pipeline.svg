<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1454" viewBox="0 0 960 1454" role="img" aria-label="The prompt-to-ship pipeline: brief, understand, plan with three reviewers, build and prove, review with four checks, pull or merge request, merge and measure, learn." font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8f8e89" stroke-width="1.6"/></marker></defs><rect width="960" height="1454" rx="14" fill="#1b1b1a"/><rect x="55" y="28" width="420" height="66" rx="9" fill="#3f3f3c" stroke="#64635e" stroke-width="1.2"/><text x="265.0" y="57.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">You ask for a change</text><text x="265.0" y="79.0" text-anchor="middle" font-size="14" fill="#d6d5cf">New chat, new feature, a fix</text><line x1="265.0" y1="94" x2="265.0" y2="128" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="130" width="420" height="66" rx="9" fill="#3f3f3c" stroke="#64635e" stroke-width="1.2"/><text x="265.0" y="159.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Hook (automatic)</text><text x="265.0" y="181.0" text-anchor="middle" font-size="14" fill="#d6d5cf">Reminds Claude of every step</text><line x1="265.0" y1="196" x2="265.0" y2="230" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="232" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="261.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 0: brief</text><text x="265.0" y="283.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Your request becomes a precise task</text><line x1="475" y1="265.0" x2="535" y2="265.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="232" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="261.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Waits on high risk</text><text x="727.5" y="283.0" text-anchor="middle" font-size="14" fill="#f6d2c2">or on an open question</text><line x1="265.0" y1="298" x2="265.0" y2="332" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="334" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="363.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 1: understand</text><text x="265.0" y="385.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Code, git history, documents</text><line x1="475" y1="367.0" x2="535" y2="367.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="334" width="385" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="727.5" y="363.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Code search, researcher</text><text x="727.5" y="385.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Optional: large code base, outside facts</text><line x1="265.0" y1="400" x2="265.0" y2="434" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="436" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="465.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 2: plan</text><text x="265.0" y="487.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Approach and risks</text><line x1="265.0" y1="502" x2="265.0" y2="520" stroke="#8f8e89" stroke-width="1.5"/><line x1="175.0" y1="520" x2="785.0" y2="520" stroke="#8f8e89" stroke-width="1.5"/><line x1="175.0" y1="520" x2="175.0" y2="552" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="554" width="270" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="175.0" y="583.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Architect</text><text x="175.0" y="605.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Always</text><line x1="480.0" y1="520" x2="480.0" y2="552" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="345" y="554" width="270" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="480.0" y="583.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">UI specialist</text><text x="480.0" y="605.0" text-anchor="middle" font-size="14" fill="#bfe8d8">If there is a user interface</text><line x1="785.0" y1="520" x2="785.0" y2="552" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="554" width="270" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="785.0" y="583.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Product expert</text><text x="785.0" y="605.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Always</text><line x1="175.0" y1="620" x2="175.0" y2="638" stroke="#8f8e89" stroke-width="1.5"/><line x1="480.0" y1="620" x2="480.0" y2="638" stroke="#8f8e89" stroke-width="1.5"/><line x1="785.0" y1="620" x2="785.0" y2="638" stroke="#8f8e89" stroke-width="1.5"/><line x1="175.0" y1="638" x2="785.0" y2="638" stroke="#8f8e89" stroke-width="1.5"/><line x1="265.0" y1="638" x2="265.0" y2="670" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="672" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="701.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Plan with three verdicts</text><text x="265.0" y="723.0" text-anchor="middle" font-size="14" fill="#d6d3f5">At most five lines each</text><line x1="475" y1="705.0" x2="535" y2="705.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="672" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="701.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Waits for your go</text><text x="727.5" y="723.0" text-anchor="middle" font-size="14" fill="#f6d2c2">Normal and high risk</text><line x1="265.0" y1="738" x2="265.0" y2="772" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="774" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="803.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Steps 3 and 4: build and prove</text><text x="265.0" y="825.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Own branch, real test output</text><line x1="265.0" y1="840" x2="265.0" y2="874" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="876" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="905.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 5: review</text><text x="265.0" y="927.0" text-anchor="middle" font-size="14" fill="#d6d3f5">At most three rounds</text><line x1="265.0" y1="942" x2="265.0" y2="960" stroke="#8f8e89" stroke-width="1.5"/><line x1="126.0" y1="960" x2="816.0" y2="960" stroke="#8f8e89" stroke-width="1.5"/><line x1="126.0" y1="960" x2="126.0" y2="992" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="25" y="994" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="126.0" y="1023.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Fresh reviewer</text><text x="126.0" y="1045.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Sees only the change</text><line x1="356.0" y1="960" x2="356.0" y2="992" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="255" y="994" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="356.0" y="1023.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Security reviewer</text><text x="356.0" y="1045.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Normal and high risk</text><line x1="586.0" y1="960" x2="586.0" y2="992" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="485" y="994" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="586.0" y="1023.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Validator</text><text x="586.0" y="1045.0" text-anchor="middle" font-size="14" fill="#bfe8d8">One per serious finding</text><line x1="816.0" y1="960" x2="816.0" y2="992" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="715" y="994" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="816.0" y="1023.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">UI and product</text><text x="816.0" y="1045.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Check the result</text><line x1="126.0" y1="1060" x2="126.0" y2="1078" stroke="#8f8e89" stroke-width="1.5"/><line x1="356.0" y1="1060" x2="356.0" y2="1078" stroke="#8f8e89" stroke-width="1.5"/><line x1="586.0" y1="1060" x2="586.0" y2="1078" stroke="#8f8e89" stroke-width="1.5"/><line x1="816.0" y1="1060" x2="816.0" y2="1078" stroke="#8f8e89" stroke-width="1.5"/><line x1="126.0" y1="1078" x2="816.0" y2="1078" stroke="#8f8e89" stroke-width="1.5"/><line x1="265.0" y1="1078" x2="265.0" y2="1110" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1112" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1141.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 6: pull or merge request</text><text x="265.0" y="1163.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Tested, risk, how to revert</text><line x1="475" y1="1145.0" x2="535" y2="1145.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="1112" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="1141.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">You decide</text><text x="727.5" y="1163.0" text-anchor="middle" font-size="14" fill="#f6d2c2">About the merge</text><line x1="265.0" y1="1178" x2="265.0" y2="1212" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1214" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1243.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 7: merge and measure</text><text x="265.0" y="1265.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Checks the goal after the release</text><line x1="475" y1="1247.0" x2="535" y2="1247.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="1214" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="1243.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Your word, each time</text><text x="727.5" y="1265.0" text-anchor="middle" font-size="14" fill="#f6d2c2">Also for the release</text><line x1="265.0" y1="1280" x2="265.0" y2="1314" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1316" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1345.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 8: learn</text><text x="265.0" y="1367.0" text-anchor="middle" font-size="14" fill="#d6d3f5">A mistake becomes a new rule</text><rect x="55" y="1409" width="18" height="18" rx="4" fill="#3c3489" stroke="#5b52c4"/><text x="83" y="1423" font-size="15" fill="#d6d5cf">Main session</text><rect x="221.39999999999998" y="1409" width="18" height="18" rx="4" fill="#0f5c45" stroke="#2a8a69"/><text x="249.39999999999998" y="1423" font-size="15" fill="#d6d5cf">Separate agent</text><rect x="404.19999999999993" y="1409" width="18" height="18" rx="4" fill="#7a2e14" stroke="#b04a26"/><text x="432.19999999999993" y="1423" font-size="15" fill="#d6d5cf">Waits for you</text><rect x="578.8" y="1409" width="18" height="18" rx="4" fill="#3f3f3c" stroke="#64635e"/><text x="606.8" y="1423" font-size="15" fill="#d6d5cf">Start and automatic</text></svg>
