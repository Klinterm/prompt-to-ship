<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1588" viewBox="0 0 960 1588" role="img" aria-label="The prompt-to-ship pipeline: brief, understand, plan with three reviewers, build and prove, review with four checks, pull or merge request, merge and measure, learn." font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8f8e89" stroke-width="1.6"/></marker></defs><rect width="960" height="1588" rx="14" fill="#1b1b1a"/><rect x="55" y="28" width="420" height="66" rx="9" fill="#3f3f3c" stroke="#64635e" stroke-width="1.2"/><text x="265.0" y="57.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">You ask for a change</text><text x="265.0" y="79.0" text-anchor="middle" font-size="14" fill="#d6d5cf">New chat, new feature, a fix</text><line x1="265.0" y1="94" x2="265.0" y2="128" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="130" width="420" height="66" rx="9" fill="#3f3f3c" stroke="#64635e" stroke-width="1.2"/><text x="265.0" y="159.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Hook (automatic)</text><text x="265.0" y="181.0" text-anchor="middle" font-size="14" fill="#d6d5cf">Reminds Claude of every step</text><line x1="265.0" y1="196" x2="265.0" y2="230" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="232" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="261.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 0: brief</text><text x="265.0" y="283.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Your request becomes a precise task</text><line x1="475" y1="265.0" x2="535" y2="265.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="232" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="261.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Waits on high risk</text><text x="727.5" y="283.0" text-anchor="middle" font-size="14" fill="#f6d2c2">or on an open question</text><line x1="265.0" y1="298" x2="265.0" y2="332" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="334" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="363.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 1: understand</text><text x="265.0" y="385.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Code, git history, documents</text><line x1="265.0" y1="400" x2="265.0" y2="418" stroke="#8f8e89" stroke-width="1.5"/><line x1="220.0" y1="418" x2="640.0" y2="418" stroke="#8f8e89" stroke-width="1.5"/><line x1="220.0" y1="418" x2="220.0" y2="450" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="70" y="452" width="300" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="220.0" y="481.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Code search</text><text x="220.0" y="503.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Always; own agent in a large code base</text><line x1="640.0" y1="418" x2="640.0" y2="450" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="452" width="300" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="640.0" y="481.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Researcher</text><text x="640.0" y="503.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Only for outside facts</text><line x1="374" y1="485.0" x2="486" y2="485.0" stroke="#8f8e89" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="220.0" y1="518" x2="220.0" y2="536" stroke="#8f8e89" stroke-width="1.5"/><line x1="640.0" y1="518" x2="640.0" y2="536" stroke="#8f8e89" stroke-width="1.5"/><line x1="220.0" y1="536" x2="640.0" y2="536" stroke="#8f8e89" stroke-width="1.5"/><line x1="265.0" y1="536" x2="265.0" y2="568" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="570" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="599.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 2: plan</text><text x="265.0" y="621.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Approach and risks</text><line x1="265.0" y1="636" x2="265.0" y2="654" stroke="#8f8e89" stroke-width="1.5"/><line x1="175.0" y1="654" x2="785.0" y2="654" stroke="#8f8e89" stroke-width="1.5"/><line x1="175.0" y1="654" x2="175.0" y2="686" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="688" width="270" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="175.0" y="717.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Architect</text><text x="175.0" y="739.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Always</text><line x1="480.0" y1="654" x2="480.0" y2="686" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="345" y="688" width="270" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="480.0" y="717.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">UI specialist</text><text x="480.0" y="739.0" text-anchor="middle" font-size="14" fill="#bfe8d8">If there is a user interface</text><line x1="785.0" y1="654" x2="785.0" y2="686" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="650" y="688" width="270" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="785.0" y="717.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Product expert</text><text x="785.0" y="739.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Always</text><line x1="175.0" y1="754" x2="175.0" y2="772" stroke="#8f8e89" stroke-width="1.5"/><line x1="480.0" y1="754" x2="480.0" y2="772" stroke="#8f8e89" stroke-width="1.5"/><line x1="785.0" y1="754" x2="785.0" y2="772" stroke="#8f8e89" stroke-width="1.5"/><line x1="175.0" y1="772" x2="785.0" y2="772" stroke="#8f8e89" stroke-width="1.5"/><line x1="265.0" y1="772" x2="265.0" y2="804" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="806" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="835.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Plan with three verdicts</text><text x="265.0" y="857.0" text-anchor="middle" font-size="14" fill="#d6d3f5">At most five lines each</text><line x1="475" y1="839.0" x2="535" y2="839.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="806" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="835.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Waits for your go</text><text x="727.5" y="857.0" text-anchor="middle" font-size="14" fill="#f6d2c2">Normal and high risk</text><line x1="265.0" y1="872" x2="265.0" y2="906" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="908" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="937.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Steps 3 and 4: build and prove</text><text x="265.0" y="959.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Own branch, real test output</text><line x1="265.0" y1="974" x2="265.0" y2="1008" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1010" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1039.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 5: review</text><text x="265.0" y="1061.0" text-anchor="middle" font-size="14" fill="#d6d3f5">At most three rounds</text><line x1="265.0" y1="1076" x2="265.0" y2="1094" stroke="#8f8e89" stroke-width="1.5"/><line x1="126.0" y1="1094" x2="816.0" y2="1094" stroke="#8f8e89" stroke-width="1.5"/><line x1="126.0" y1="1094" x2="126.0" y2="1126" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="25" y="1128" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="126.0" y="1157.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Fresh reviewer</text><text x="126.0" y="1179.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Sees only the change</text><line x1="356.0" y1="1094" x2="356.0" y2="1126" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="255" y="1128" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="356.0" y="1157.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Security reviewer</text><text x="356.0" y="1179.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Normal and high risk</text><line x1="586.0" y1="1094" x2="586.0" y2="1126" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="485" y="1128" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="586.0" y="1157.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Validator</text><text x="586.0" y="1179.0" text-anchor="middle" font-size="14" fill="#bfe8d8">One per serious finding</text><line x1="816.0" y1="1094" x2="816.0" y2="1126" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="715" y="1128" width="202" height="66" rx="9" fill="#0f5c45" stroke="#2a8a69" stroke-width="1.2"/><text x="816.0" y="1157.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">UI and product</text><text x="816.0" y="1179.0" text-anchor="middle" font-size="14" fill="#bfe8d8">Check the result</text><line x1="126.0" y1="1194" x2="126.0" y2="1212" stroke="#8f8e89" stroke-width="1.5"/><line x1="356.0" y1="1194" x2="356.0" y2="1212" stroke="#8f8e89" stroke-width="1.5"/><line x1="586.0" y1="1194" x2="586.0" y2="1212" stroke="#8f8e89" stroke-width="1.5"/><line x1="816.0" y1="1194" x2="816.0" y2="1212" stroke="#8f8e89" stroke-width="1.5"/><line x1="126.0" y1="1212" x2="816.0" y2="1212" stroke="#8f8e89" stroke-width="1.5"/><line x1="265.0" y1="1212" x2="265.0" y2="1244" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1246" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1275.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 6: pull or merge request</text><text x="265.0" y="1297.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Tested, risk, how to revert</text><line x1="475" y1="1279.0" x2="535" y2="1279.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="1246" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="1275.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">You decide</text><text x="727.5" y="1297.0" text-anchor="middle" font-size="14" fill="#f6d2c2">About the merge</text><line x1="265.0" y1="1312" x2="265.0" y2="1346" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1348" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1377.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 7: merge and measure</text><text x="265.0" y="1399.0" text-anchor="middle" font-size="14" fill="#d6d3f5">Checks the goal after the release</text><line x1="475" y1="1381.0" x2="535" y2="1381.0" stroke="#8f8e89" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="535" y="1348" width="385" height="66" rx="9" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="727.5" y="1377.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Your word, each time</text><text x="727.5" y="1399.0" text-anchor="middle" font-size="14" fill="#f6d2c2">Also for the release</text><line x1="265.0" y1="1414" x2="265.0" y2="1448" stroke="#8f8e89" stroke-width="1.5" marker-end="url(#a)"/><rect x="55" y="1450" width="420" height="66" rx="9" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="265.0" y="1479.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Step 8: learn</text><text x="265.0" y="1501.0" text-anchor="middle" font-size="14" fill="#d6d3f5">A mistake becomes a new rule</text><rect x="55" y="1543" width="18" height="18" rx="4" fill="#3c3489" stroke="#5b52c4"/><text x="83" y="1557" font-size="15" fill="#d6d5cf">Main session</text><rect x="221.39999999999998" y="1543" width="18" height="18" rx="4" fill="#0f5c45" stroke="#2a8a69"/><text x="249.39999999999998" y="1557" font-size="15" fill="#d6d5cf">Separate agent</text><rect x="404.19999999999993" y="1543" width="18" height="18" rx="4" fill="#7a2e14" stroke="#b04a26"/><text x="432.19999999999993" y="1557" font-size="15" fill="#d6d5cf">Waits for you</text><rect x="578.8" y="1543" width="18" height="18" rx="4" fill="#3f3f3c" stroke="#64635e"/><text x="606.8" y="1557" font-size="15" fill="#d6d5cf">Start and automatic</text></svg>
