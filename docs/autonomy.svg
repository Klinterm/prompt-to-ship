<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-label="Autonomy levels. ask: you approve plans with normal or high risk, you merge and release. change-request: no wait for the plan, you merge and release. merge: Claude merges when every check passes, you release. release: Claude merges and releases when every check passes." font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8f8e89" stroke-width="1.6"/></marker></defs><rect width="960" height="414" rx="14" fill="#1b1b1a"/><text x="30" y="40" font-size="15" font-weight="600" fill="#d6d5cf">Level</text><text x="306.0" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#d6d5cf">Approve plan</text><text x="448.0" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#d6d5cf">Build and review</text><text x="590.0" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#d6d5cf">Open PR or MR</text><text x="732.0" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#d6d5cf">Merge</text><text x="874.0" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#d6d5cf">Release</text><text x="30" y="89.0" font-size="17" font-weight="600" fill="#ffffff">ask</text><text x="30" y="108.0" font-size="13" fill="#a9a8a2">default</text><rect x="240" y="60" width="132" height="54" rx="8" fill="#7a2e14" stroke="#b04a26" stroke-width="1.2"/><text x="306.0" y="93.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">You</text><rect x="382" y="60" width="132" height="54" rx="8" fill="#3c3489" stroke="#5b52c4" stroke-width="1.2"/><text x="448.0" y="93.0" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Claude</text><rect x="524" y="60" width="132" height="54" rx="8" fill="#3c3489" stroke="#5b52c4" stroke-w