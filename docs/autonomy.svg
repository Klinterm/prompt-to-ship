0" y="340" font-size="14" fill="#d6d5cf">* Only when every check passes. Otherwise Claude stops and tells you why.</text><text x="30" y="364" font-size="14" fill="#d6d5cf">At level ask, only plans with normal or high risk wait for your approval.</text><text x="30" y="388" font-size="14" fill="#d6d5cf">At every level, high-risk changes wait for you before anything is pushed.</text></svg>
