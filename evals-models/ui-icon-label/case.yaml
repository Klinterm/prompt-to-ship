schema_version: "1.1"
name: ui-icon-label
# Agent model comparison (references/pipeline.md, "Agent models"). Run with
# --eval-dir evals-models --ablation none --model sonnet and AGENT_MODEL set to the agent model.
graders:
  - name: agent-started
    type: regex
    pattern: '"subagent_type"\s*:\s*"[^"]*ui-specialist"'
    flags: i
    target: trace
  - name: names-the-problem
    type: regex
    pattern: 'aria-label|accessible name|screen reader|cart\.delete'
    flags: i
    target: last_message
context:
  scaffold_script: fixture.sh
