schema_version: "1.1"
name: debugger-dst
# Agent model comparison (references/pipeline.md, "Agent models"). Run with
# --eval-dir evals-models --ablation none --model sonnet and AGENT_MODEL set to the agent model.
graders:
  - name: agent-started
    type: regex
    pattern: '"subagent_type"\s*:\s*"[^"]*debugger"'
    flags: i
    target: trace
  - name: names-the-problem
    type: regex
    pattern: 'daylight|DST|summer ?time|winter ?time|UTC\+1|time ?zone'
    flags: i
    target: last_message
context:
  scaffold_script: fixture.sh
