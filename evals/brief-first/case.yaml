schema_version: "1.1"
name: brief-first
# Run with --allow-tools Edit Write, so the arm without the plugin can edit.
graders:
  - name: has-done-when
    type: regex
    pattern: '(^|\\n)[\s*#>]*done when\W{0,2}:[\s*]*[A-Za-z0-9`]'
    flags: im
    target: trace
context:
  scaffold_script: fixture.sh
