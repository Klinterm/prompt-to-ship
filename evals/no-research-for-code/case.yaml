schema_version: "1.1"
name: no-research-for-code
# Run with --allow-tools Edit Write. No web tools: the case grades the research decision, not the facts.
# Expected delta: about 0. Claude never starts research on its own. The case guards against a
# plan that lists research questions for code-only work. A stop before the plan (for example to
# confirm PROJECT.md when the eval has no shell) passes.
graders:
  - name: no-research-questions
    type: regex
    pattern: '(^|\\n)[\s*#>`-]*research\W{0,2}:[\s*`]*(?!none)[A-Za-z0-9]'
    flags: im
    target: trace
    match: not_contains
  - name: no-researcher-run
    type: regex
    pattern: '"subagent_type"\s*:\s*"[^"]*researcher"'
    flags: im
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
