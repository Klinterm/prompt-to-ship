schema_version: "1.1"
name: no-research-for-code
# Run with --allow-tools Edit Write. No web tools: the case grades the research decision, not the facts.
# Expected delta: about 0 for no-researcher-run (Claude never starts one on its own); high for research-none.
graders:
  - name: research-none
    type: regex
    pattern: '(^|\\n)[\s*#>`-]*research\W{0,2}:[\s*`]*none'
    flags: im
    target: trace
  - name: no-researcher-run
    type: regex
    pattern: '"subagent_type"\s*:\s*"[^"]*researcher"'
    flags: im
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
