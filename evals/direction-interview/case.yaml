schema_version: "1.1"
name: direction-interview
# Run with --allow-tools Edit Write, so a change is possible and staying read-only is a choice.
# This case tests the plain-word route: the prompt has no `direction` argument.
# The case is one turn with no shell, so it sees only the findings and the first question.
# Expected delta: high: without the plugin the agent gives advice at once, with no Drift line.
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: has-drift-line
    type: regex
    pattern: 'drift\W{0,2}:'
    flags: i
    target: last_message
  - name: no-brief
    type: regex
    pattern: '(^|\\n)[\s*#>]*done when\W{0,2}:[\s*]*[A-Za-z0-9`]'
    flags: im
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
