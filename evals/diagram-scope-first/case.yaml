schema_version: "1.1"
name: diagram-scope-first
# Run with --allow-tools Edit Write, so a file is possible and asking first is a choice.
# The case is one turn, with no shell. The first reply is the scope question: numbered area options,
# an option to stop, and no diagram yet. It does not reach the verify agents or the drawing.
# Expected delta: high: without the plugin the agent draws a diagram from the files at once.
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: numbered-options
    type: regex
    pattern: '(^|\n)[\s*>-]*(1|2)[.)] '
    flags: m
    target: last_message
  - name: stop-option
    type: regex
    pattern: '\b0\b[^\n]{0,30}stop|stop[^\n]{0,30}\b0\b'
    flags: i
    target: last_message
  - name: no-svg
    type: regex
    pattern: '<svg'
    flags: i
    target: last_message
    match: not_contains
  - name: no-brief
    type: regex
    pattern: '(^|\n)[\s*#>]*done when\W{0,2}:[\s*]*[A-Za-z0-9`]'
    flags: im
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
