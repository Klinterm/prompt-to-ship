schema_version: "1.1"
name: states-report-first
# Run with --allow-tools Edit Write, so a change is possible and staying read-only is a choice.
# The case is one turn with no shell, so the report says that links were not checked.
# Expected delta: high: without the plugin the agent uses other words and may edit the code.
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: cites-a-line
    type: regex
    pattern: 'src/(orders|warehouse)\.py:\d+'
    target: last_message
  - name: opener
    type: regex
    pattern: 'changed no project file'
    flags: i
    target: last_message
  - name: names-hidden-state
    type: regex
    pattern: 'hidden states?'
    flags: i
    target: last_message
  - name: no-brief
    type: regex
    pattern: '(^|\\n)[\s*#>]*done when\W{0,2}:[\s*]*[A-Za-z0-9`]'
    flags: im
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
