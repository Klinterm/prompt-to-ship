schema_version: "1.1"
name: debug-case-first
# Run with --allow-tools Edit Write, so a change is possible and staying read-only is a choice.
# Expected delta: high: without the plugin the agent fixes the code at once, with no CASE.
graders:
  - name: has-case-block
    type: regex
    pattern: '(^|\\n)[\s*#>`-]*symptom\W{0,2}:[\s*]*[A-Za-z]'
    flags: im
    target: trace
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
context:
  scaffold_script: fixture.sh
