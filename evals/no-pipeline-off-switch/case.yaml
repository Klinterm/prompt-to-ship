schema_version: "1.1"
name: no-pipeline-off-switch
# Run with --allow-tools Edit Write.
# Expected delta: about 0. Plain Claude shows no brief either. The case guards the off switch:
# with "no pipeline:" the plugin must add nothing.
graders:
  - name: no-brief
    type: regex
    pattern: '(^|\\n)[\s*#>`-]*done when\W{0,2}:[\s*]*[A-Za-z0-9`]'
    flags: im
    target: trace
    match: not_contains
  - name: no-reviewers
    type: regex
    pattern: '"subagent_type"\s*:\s*"[^"]*(architect|product-expert|ui-specialist|fresh-reviewer)"'
    flags: i
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
