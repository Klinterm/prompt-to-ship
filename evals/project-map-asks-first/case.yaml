schema_version: "1.1"
name: project-map-asks-first
# Run with --allow-tools Edit Write, so a write is possible and asking first is a choice.
# The case is one turn, with no design connector and no shell. It tests only that the mode asks who
# reads the map and for the file link first, writes nothing and shows no BRIEF. It does not reach
# the connector path or the write list.
# Expected delta: high: without the plugin the agent has no such mode and may start building.
graders:
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: asks-audience
    type: regex
    pattern: 'who (reads|will read)|audience'
    flags: i
    target: last_message
  - name: asks-file-link
    type: regex
    pattern: '(file|design) (link|url)|link to (the|your)'
    flags: i
    target: last_message
  - name: no-brief
    type: regex
    pattern: '(^|\n)[\s*#>]*done when\W{0,2}:[\s*]*[A-Za-z0-9`]'
    flags: im
    target: trace
    match: not_contains
context:
  scaffold_script: fixture.sh
